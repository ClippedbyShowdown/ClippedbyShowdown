name: Build Windows
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Fix tauri config and capabilities
        shell: pwsh
        run: python -c "import base64, pathlib; pathlib.Path('src-tauri/tauri.conf.json').write_text(base64.b64decode('').decode()); pathlib.Path('src-tauri/capabilities/default.json').write_text(base64.b64decode('').decode()); print('fixed')"
      - run: npm install -g @tauri-apps/cli@latest
      - run: npm install
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: ClippedbyShowdown-Windows-Setup
          path: src-tauri/target/release/bundle/**/*.exe
