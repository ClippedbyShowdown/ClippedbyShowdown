name: Build Windows .EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build Tauri .EXE + Installer
        shell: pwsh
        run: |
          $found = Get-ChildItem -Recurse -Filter "Cargo.toml" | Where-Object { $_.FullName -like "*src-tauri*" } | Select-Object -First 1
          if (-not $found) { Write-Error "Could not find src-tauri/Cargo.toml anywhere in repo"; exit 1 }
          $dir = Split-Path $found.FullName -Parent
          Write-Host "Using Tauri project in: $dir"
          Set-Location $dir
          # AUTO-FIX 1: tauri.conf.json - icon only in bundle.icon
          $json = Get-Content tauri.conf.json -Raw | ConvertFrom-Json
          foreach ($w in $json.app.windows) { if ($w.PSObject.Properties.Name -contains 'icon') { $w.PSObject.Properties.Remove('icon') } }
          if ($json.app.PSObject.Properties.Name -contains 'icon') { $json.app.PSObject.Properties.Remove('icon') }
          if (-not ($json.bundle.PSObject.Properties.Name -contains 'icon')) { $json.bundle | Add-Member -NotePropertyName icon -NotePropertyValue @("icons/icon.ico") }
          $json.bundle.targets = @("nsis")
          $index = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter "index.html" | Where-Object { $_.FullName -like "*src*" } | Select-Object -First 1
          if ($index) {
            $srcDir = Split-Path $index.FullName -Parent
            $rel = [System.IO.Path]::GetRelativePath($dir, $srcDir)
            Write-Host "Setting frontendDist to: $rel"
            $json.build.frontendDist = $rel
          }
          $json | ConvertTo-Json -Depth 10 | Set-Content tauri.conf.json -Encoding UTF8
          # AUTO-FIX 2: capabilities/default.json - fs:default -> core:default for Tauri v2
          Write-Host "=== FIXING capabilities/default.json ==="
          $cap = @"
          {
            "`$schema": "https://schema.tauri.app/config/2",
            "identifier": "default",
            "description": "Capabilities for ClippedbyShowdown",
            "windows": ["main"],
            "permissions": ["core:default", "core:window:default"]
          }
          "@
          $cap | Set-Content "capabilities/default.json" -Encoding UTF8
          Get-Content "capabilities/default.json"
          Get-Content tauri.conf.json
          cargo tauri build
      - name: Upload .EXE + Setup EXE only - NO MSI
        uses: actions/upload-artifact@v4
        with:
          name: ClippedbyShowdown-Windows
          path: |
            **/target/release/*.exe
            **/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
