name: Build Windows .EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build Tauri .EXE + Installer
        shell: pwsh
        run: |
          Write-Host "=== TOP LEVEL ==="
          Get-ChildItem -Name
          Write-Host "=== FINDING Cargo.toml ==="
          $found = Get-ChildItem -Recurse -Filter "Cargo.toml" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*src-tauri*" } | Select-Object -First 1
          if (-not $found) {
            Write-Host "=== FULL LIST (first 200) ==="
            Get-ChildItem -Recurse -Name | Select-Object -First 200
            Write-Error "Could not find src-tauri/Cargo.toml anywhere in repo"
            exit 1
          }
          $dir = Split-Path $found.FullName -Parent
          Write-Host "Found Tauri project in: $dir"
          Set-Location $dir
          cargo tauri build
      - name: Upload .EXE + Setup EXE only - NO MSI
        uses: actions/upload-artifact@v4
        with:
          name: ClippedbyShowdown-Windows
          path: |
            **/target/release/*.exe
            **/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
