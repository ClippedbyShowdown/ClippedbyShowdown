name: Build Windows
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ClippedbyShowdown
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install -g @tauri-apps/cli@latest
      - run: npm install
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with: { name: ClippedbyShowdown-Windows-Setup, path: ClippedbyShowdown/src-tauri/target/release/bundle/**/*.exe }
