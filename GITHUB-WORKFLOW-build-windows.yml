name: Build Windows .EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build Tauri .EXE + Installer
        shell: pwsh
        run: |
          if (Test-Path "src-tauri/Cargo.toml") { $dir = "src-tauri" }
          elseif (Test-Path "ClippedbyShowdown-EXE-Project/src-tauri/Cargo.toml") { $dir = "ClippedbyShowdown-EXE-Project/src-tauri" }
          else { Get-ChildItem -Recurse -Name | Select-Object -First 100; Write-Error "Could not find src-tauri/Cargo.toml"; exit 1 }
          Write-Host "Building in $dir"
          Set-Location $dir
          cargo tauri build
      - name: Upload .EXE + Setup EXE only - NO MSI
        uses: actions/upload-artifact@v4
        with:
          name: ClippedbyShowdown-Windows
          path: |
            **/target/release/*.exe
            **/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
