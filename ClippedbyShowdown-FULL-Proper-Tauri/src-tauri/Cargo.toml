[package]
name = "clippedbyshowdown"
version = "1.0.1"
description = "ClippedbyShowdown - Real Working Editor"
edition = "2021"
[build-dependencies]
tauri-build = { version = "1.5", features = [] }
[dependencies]
tauri = { version = "1.5", features = ["shell-open","dialog-open","dialog-save","fs-all","path-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

dirs = "5"
